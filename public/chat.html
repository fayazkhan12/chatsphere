<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatSphere</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-container" id="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="me d-flex align-items-center">
          <img id="myAvatar" class="avatar" src="" alt="me" />
          <div class="ms-2">
            <div id="myName" class="fw-bold"></div>
            <small class="text-success">🟢 Online</small>
          </div>
        </div>
        <div>
          <button class="icon-btn" id="themeToggle" title="Toggle theme"><i class="bi bi-moon-stars"></i></button>
          <button class="icon-btn" id="newGroupBtn" title="New group"><i class="bi bi-people"></i></button>
          <button class="icon-btn" id="logoutBtn" title="Logout"><i class="bi bi-box-arrow-right"></i></button>
        </div>
      </div>

      <div class="search-box">
        <i class="bi bi-search"></i>
        <input type="text" id="searchInput" placeholder="Enter exact username to chat..." />
      </div>

      <div id="searchResults" class="search-results d-none"></div>

      <div class="chat-list" id="chatList"></div>
    </aside>

    <!-- CONVERSATION -->
    <main class="conversation">
      <div id="emptyState" class="empty-state">
        <i class="bi bi-chat-dots"></i>
        <p>Select a conversation to start chatting</p>
      </div>

      <div id="chatWindow" class="chat-window d-none">
        <div class="chat-header">
          <img id="chatAvatar" class="avatar" src="" alt="" />
          <div class="ms-2 flex-grow-1">
            <div id="chatTitle" class="fw-bold"></div>
            <small id="chatSubtitle" class="text-muted"></small>
          </div>
          <button type="button" id="voiceCallBtn" class="icon-btn" title="Voice call"><i class="bi bi-telephone-fill"></i></button>
          <button type="button" id="videoCallBtn" class="icon-btn" title="Video call"><i class="bi bi-camera-video-fill"></i></button>
          <button type="button" id="groupVoiceCallBtn" class="icon-btn d-none" title="Group voice call"><i class="bi bi-telephone-fill"></i></button>
          <button type="button" id="groupVideoCallBtn" class="icon-btn d-none" title="Group video call"><i class="bi bi-camera-video-fill"></i></button>
        </div>

        <div class="messages" id="messagesContainer"></div>

        <div class="typing-indicator d-none" id="typingIndicator"></div>

        <form class="message-input" id="messageForm">
          <input type="file" id="fileInput" accept="image/*,.pdf,.docx,.mp3,.mp4" hidden />
          <button type="button" id="attachBtn" title="Attach file"><i class="bi bi-paperclip"></i></button>
          <button type="button" id="locationBtn" title="Share location"><i class="bi bi-geo-alt-fill"></i></button>
          <input type="text" id="messageText" placeholder="Type a message..." autocomplete="off" />
          <button type="submit"><i class="bi bi-send-fill"></i></button>
        </form>
      </div>
    </main>
  </div>

  <!-- New Group Modal -->
  <div class="modal fade" id="groupModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Create Group</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="text" class="form-control mb-2" id="groupNameInput" placeholder="Group name" />
          <input type="text" class="form-control mb-2" id="groupMemberSearch" placeholder="Search users to add..." />
          <div id="groupMemberResults" class="search-results-inline"></div>
          <div id="selectedMembers" class="mt-2"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary" id="createGroupBtn">Create Group</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Add participant to an active group call -->
  <div class="modal fade" id="groupAddParticipantModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add to call</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="groupAddParticipantList"></div>
        </div>
      </div>
    </div>
  </div>

  <audio id="notifSound" src="https://cdn.jsdelivr.net/gh/naptha/notification-sounds@master/notify.mp3" preload="auto"></audio>

  <div id="toastContainer" class="toast-container"></div>

  <!-- Incoming 1-to-1 call popup -->
  <div id="incomingCallModal" class="call-incoming d-none">
    <img id="incomingCallAvatar" class="avatar-lg" src="" alt="" />
    <div id="incomingCallName" class="fw-bold fs-5 mt-2"></div>
    <div id="incomingCallType" class="text-muted mb-3"></div>
    <div class="d-flex gap-3">
      <button id="rejectCallBtn" class="call-btn call-btn-reject"><i class="bi bi-telephone-x-fill"></i></button>
      <button id="acceptCallBtn" class="call-btn call-btn-accept"><i class="bi bi-telephone-fill"></i></button>
    </div>
  </div>

  <!-- Active 1-to-1 call screen -->
  <div id="callScreen" class="call-screen d-none">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>

    <div id="callStatusOverlay" class="call-status-overlay">
      <img id="callPeerAvatar" class="avatar-lg" src="" alt="" />
      <div id="callPeerName" class="fw-bold fs-5 mt-2"></div>
      <div id="callStatusText" class="text-muted"></div>
    </div>

    <div class="call-controls">
      <button id="toggleMuteBtn" class="call-btn call-btn-secondary"><i class="bi bi-mic-fill"></i></button>
      <button id="toggleCameraBtn" class="call-btn call-btn-secondary"><i class="bi bi-camera-video-fill"></i></button>
      <button id="endCallBtn" class="call-btn call-btn-reject"><i class="bi bi-telephone-x-fill"></i></button>
    </div>
  </div>

  <!-- Incoming GROUP call popup -->
  <div id="groupIncomingCallModal" class="call-incoming d-none">
    <img id="groupIncomingCallAvatar" class="avatar-lg" src="" alt="" />
    <div id="groupIncomingCallName" class="fw-bold fs-5 mt-2"></div>
    <div id="groupIncomingCallType" class="text-muted mb-3"></div>
    <div class="d-flex gap-3">
      <button id="groupRejectCallBtn" class="call-btn call-btn-reject"><i class="bi bi-telephone-x-fill"></i></button>
      <button id="groupAcceptCallBtn" class="call-btn call-btn-accept"><i class="bi bi-telephone-fill"></i></button>
    </div>
  </div>

  <!-- Active GROUP call screen -->
  <div id="groupCallScreen" class="call-screen d-none">
    <div id="groupCallGrid" class="group-call-grid"></div>

    <div class="call-controls">
      <button id="groupToggleMuteBtn" class="call-btn call-btn-secondary"><i class="bi bi-mic-fill"></i></button>
      <button id="groupToggleCameraBtn" class="call-btn call-btn-secondary"><i class="bi bi-camera-video-fill"></i></button>
      <button id="groupAddParticipantBtn" class="call-btn call-btn-secondary"><i class="bi bi-person-plus-fill"></i></button>
      <button id="groupLeaveCallBtn" class="call-btn call-btn-reject"><i class="bi bi-telephone-x-fill"></i></button>
    </div>
  </div>

  <audio id="ringtoneSound" src="https://cdn.jsdelivr.net/gh/naptha/notification-sounds@master/notify.mp3" loop preload="auto"></audio>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/socket.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/call.js"></script>
  <script src="js/groupcall.js"></script>
</body>
</html>
